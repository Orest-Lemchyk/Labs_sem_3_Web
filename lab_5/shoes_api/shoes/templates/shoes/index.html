{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Shoes list</title>
  <link rel="stylesheet" href="{% static 'shoes/css/style.css' %}">
</head>
<body>
  <div class="container">
    <h1>Shoes list</h1>
    <input type="text" id="searchInput" placeholder="Search...">
    <select id="sortSelect">
      <option value="">Sort by</option>
      <option value="producer">Producer</option>
      <option value="price">Price</option>
      <option value="size">Size</option>
      <option value="color">Color</option>
    </select>

    <a href="{% url 'shoe_create' %}"><button>+ Add</button></a>

    <table id="shoesTable">
      <thead>
        <tr>
          <th>Producer</th><th>Price</th><th>Size</th><th>Color</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="shoesBody">
        {% for shoe in shoes %}
        <tr data-id="{{ shoe.id }}">
          <td>{{ shoe.producer }}</td>
          <td>{{ shoe.price }}</td>
          <td>{{ shoe.size }}</td>
          <td>{{ shoe.color }}</td>
          <td>
            <a href="{% url 'shoe_edit' shoe.id %}"><button>Edit</button></a>
            <button class="delete-btn">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    function loadShoes() {
      const query = searchInput.value.trim();
      const sort = sortSelect.value;
      const params = new URLSearchParams({ q: query, sort: sort });

      fetch(`/?${params}`, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(r => r.json())
        .then(data => {
          const body = document.getElementById("shoesBody");
          body.innerHTML = "";
          data.shoes.forEach(s => {
            body.innerHTML += `
              <tr data-id="${s.id}">
                <td>${s.producer}</td>
                <td>${s.price}</td>
                <td>${s.size}</td>
                <td>${s.color}</td>
                <td>
                  <a href="/${s.id}/edit/">Edit</a>
                  <button class="delete-btn">Delete</button>
                </td>
              </tr>`;
          });
        });
    }

    searchInput.addEventListener("input", loadShoes);
    sortSelect.addEventListener("change", loadShoes);

    document.addEventListener("click", e => {
      if (e.target.classList.contains("delete-btn")) {
        const id = e.target.closest("tr").dataset.id;
        fetch(`/${id}/delete/`, {
          method: "DELETE",
          headers: { "X-CSRFToken": getCookie("csrftoken") },
        }).then(() => loadShoes());
      }
    });

    function getCookie(name) {
      const cookieValue = document.cookie.split('; ')
        .find(row => row.startsWith(name + '='))
        ?.split('=')[1];
      return cookieValue;
    }
  </script>
</body>
</html>
